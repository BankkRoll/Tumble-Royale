name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Browser smoke tests are slower and GPU-less runners only get WebGL2
    # through SwiftShader, so they run on main rather than gating every PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PW_CHANNEL: chromium
      PW_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: apps/client
        run: npx playwright install --with-deps chromium
      - name: Build the client in sandbox mode
        run: pnpm --filter @tumble/client build:sandbox
      - name: Run the menu and phase 0 specs
        working-directory: apps/client
        # The runner has no WebGPU; the "webgpu" case would only re-test the
        # WebGL2 fallback that the "webgl" case already covers.
        run: npx playwright test e2e/menu.spec.ts e2e/phase0.spec.ts --workers=1 --grep-invert "renders on webgpu"
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/client/playwright-report
            apps/client/test-results
          retention-days: 14
