<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5aa9ff" />
    <title>Tumble Royale</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5aa9ff;
        font-family: 'Trebuchet MS', system-ui, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(#5aa9ff, #ffd6f2);
        color: #fff;
        z-index: 100;
        transition: opacity 0.4s;
      }
      #boot .tumbler {
        width: 56px;
        height: 72px;
        border-radius: 28px 28px 22px 22px;
        background: #ff6fb5;
        box-shadow: inset -6px -8px 0 rgba(0, 0, 0, 0.12);
        margin: 0 auto 18px;
        animation: hop 0.7s ease-in-out infinite;
        position: relative;
      }
      #boot .tumbler::after {
        content: '';
        position: absolute;
        left: 10px;
        right: 10px;
        top: 14px;
        height: 22px;
        border-radius: 12px;
        background: #fff;
      }
      @keyframes hop {
        0%,
        100% {
          transform: translateY(0) scale(1.08, 0.92);
        }
        50% {
          transform: translateY(-26px) scale(0.94, 1.06);
        }
      }
      #boot .bar {
        width: 220px;
        height: 10px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      #boot .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        background: #fff;
        transition: width 0.2s;
      }
      #boot .label {
        text-align: center;
        margin-top: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="boot">
      <div>
        <div class="tumbler"></div>
        <div class="bar"><i id="boot-progress"></i></div>
        <div class="label" id="boot-label">Loading…</div>
      </div>
    </div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
