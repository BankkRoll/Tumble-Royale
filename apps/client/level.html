<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tumble Royale · Level Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5aa9ff;
        font-family: system-ui, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        right: 8px;
        bottom: 8px;
        max-width: 46vw;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(20, 12, 40, 0.68);
        color: #e9f3ff;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">Loading…</div>
    <script type="module" src="/src/level-viewer/main.ts"></script>
  </body>
</html>
