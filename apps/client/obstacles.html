<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5aa9ff" />
    <title>Tumble Royale · Obstacle Gallery</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5aa9ff;
        font-family: 'Trebuchet MS', system-ui, sans-serif;
      }
      #gallery {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        background: linear-gradient(#5aa9ff, #ffd6f2);
        z-index: 100;
      }
      .labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .label {
        pointer-events: auto;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 5px 11px 6px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.88);
        color: #2b1d3a;
        box-shadow: 0 3px 0 rgba(43, 29, 58, 0.18);
        font-size: 13px;
        white-space: nowrap;
        transition: transform 0.15s;
      }
      .label:hover {
        transform: scale(1.08);
      }
      .label b {
        font-size: 14px;
      }
      .label span {
        font: 11px ui-monospace, Consolas, monospace;
        opacity: 0.65;
      }
      .label em {
        font: 11px ui-monospace, Consolas, monospace;
        color: #d1004f;
        max-width: 260px;
        white-space: normal;
        text-align: center;
      }
      .label.far {
        padding: 2px 8px 3px;
        font-size: 11px;
        opacity: 0.85;
      }
      .label.far b {
        font-size: 11px;
      }
      .label.far span,
      .label.far em {
        display: none;
      }
      .label.error {
        background: rgba(255, 220, 232, 0.95);
      }
      .event-log {
        position: fixed;
        left: 8px;
        bottom: 8px;
        z-index: 50;
        padding: 6px 9px;
        border-radius: 8px;
        background: rgba(20, 12, 40, 0.62);
        color: #e9f3ff;
        font: 11px/1.4 ui-monospace, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
        min-width: 240px;
      }
    </style>
  </head>
  <body>
    <canvas id="gallery" tabindex="0"></canvas>
    <div id="status">Loading obstacles…</div>
    <script type="module" src="/src/obstacles-gallery/main.ts"></script>
  </body>
</html>
