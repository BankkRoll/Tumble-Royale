<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5aa9ff" />
    <title>Tumbler Playground</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5aa9ff;
        font-family: 'Trebuchet MS', system-ui, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(#5aa9ff, #ffd6f2);
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.04em;
        z-index: 100;
        transition: opacity 0.4s;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(43, 29, 58, 0.6);
        color: #fff;
        font-size: 13px;
        pointer-events: none;
        z-index: 30;
        transition: opacity 0.3s;
      }
      #readout {
        position: fixed;
        left: 8px;
        top: 8px;
        z-index: 50;
        padding: 6px 9px;
        border-radius: 8px;
        background: rgba(20, 12, 40, 0.62);
        color: #e9f3ff;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        pointer-events: none;
        white-space: pre;
        min-width: 210px;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="readout"></div>
    <div id="hint">Click to play · WASD · Space jump · Ctrl / LMB / C dive · Shift / RMB grab · R respawn</div>
    <div id="boot">Warming up the Tumbler…</div>
    <script type="module" src="/src/playground/main.ts"></script>
  </body>
</html>
