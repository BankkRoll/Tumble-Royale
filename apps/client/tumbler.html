<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5aa9ff" />
    <title>Tumbler Lab · Tumble Royale</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(#5aa9ff, #ffd6f2);
        font-family: 'Trebuchet MS', system-ui, sans-serif;
        touch-action: none;
      }
      #lab {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #title {
        position: fixed;
        left: 50%;
        top: 14px;
        transform: translateX(-50%);
        padding: 8px 20px 9px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #3a2a5c;
        font-weight: 800;
        letter-spacing: 0.06em;
        box-shadow: 0 4px 0 rgba(58, 42, 92, 0.18);
        pointer-events: none;
        white-space: nowrap;
      }
      #title b {
        color: #ff4f8b;
      }
      #modes {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      #modes button,
      .chip {
        font:
          800 14px 'Trebuchet MS',
          system-ui,
          sans-serif;
        letter-spacing: 0.04em;
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
        color: #3a2a5c;
        background: #fff;
        box-shadow: 0 4px 0 rgba(58, 42, 92, 0.25);
        transition: transform 0.08s;
      }
      #modes button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(58, 42, 92, 0.25);
      }
      #modes button.on {
        background: #ff4f8b;
        color: #fff;
      }
      #actions {
        position: fixed;
        left: 10px;
        bottom: 76px;
        display: grid;
        grid-template-columns: repeat(3, auto);
        gap: 6px;
        max-width: 330px;
      }
      #actions .chip {
        padding: 7px 11px;
        font-size: 12px;
        background: #ffe14d;
      }
      #actions .chip.emote {
        background: #7ff0c8;
      }
      #actions .chip.victory {
        background: #ffc4e8;
      }
      @media (max-width: 720px) {
        #actions {
          grid-template-columns: repeat(2, auto);
          bottom: 64px;
          max-width: 220px;
        }
        #actions .chip {
          padding: 5px 8px;
          font-size: 11px;
        }
        #modes button {
          padding: 8px 11px;
          font-size: 12px;
        }
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 18px;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        z-index: 100;
        transition: opacity 0.4s;
      }
    </style>
  </head>
  <body>
    <canvas id="lab" tabindex="0"></canvas>
    <div id="title">TUMBLER <b>LAB</b></div>
    <div id="modes"></div>
    <div id="actions"></div>
    <div id="boot">Waking up the Tumblers…</div>
    <script type="module" src="/src/tumbler-lab/main.ts"></script>
  </body>
</html>
