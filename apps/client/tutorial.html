<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5aa9ff" />
    <title>Tumble Royale · Practice Island</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5aa9ff;
        font-family: 'Trebuchet MS', system-ui, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(#5aa9ff, #ffd6f2);
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        z-index: 100;
        transition: opacity 0.4s;
      }
      #ended {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        z-index: 50;
        background: rgba(43, 26, 94, 0.55);
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
      }
      #ended button {
        margin-top: 14px;
        font: inherit;
        padding: 10px 26px;
        border-radius: 999px;
        border: 3px solid #2b1a5e;
        background: #ffd23f;
        color: #2b1a5e;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="boot"><div id="boot-label">Inflating Practice Island…</div></div>
    <div id="ended"><div><div id="ended-label">Tutorial over</div><button id="again" type="button">Run it again</button></div></div>
    <div id="ui"></div>
    <script type="module" src="/src/tutorial-dev/main.ts"></script>
  </body>
</html>
