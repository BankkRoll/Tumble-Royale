# Single-server Tumble Royale: Postgres, Redis, the API (after a one-shot
# migration), matchmaker, one game server, the web client and a Caddy edge
# with automatic HTTPS. docs/SELF_HOSTING.md walks through it.
#
#   pnpm setup:env --production --domain play.example.com   # writes deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Only Caddy publishes ports (80, 443). Every other service, including the
# internal and metrics endpoints, is reachable only on the compose network.
# The optional `voice` profile adds a coturn TURN relay on the host network.

name: tumble

x-app: &app
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '5'

x-api-build: &api-build
  context: ..
  dockerfile: deploy/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tumble}
      POSTGRES_DB: ${POSTGRES_DB:-tumble}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env is missing; run pnpm setup:env --production --domain <domain>}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file: parties, presence and leaderboards survive a restart.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies pending SQL migrations, then exits; the API starts only after it succeeds.
  migrate:
    <<: *app
    image: tumble/api:${TAG:-latest}
    build: *api-build
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    image: tumble/api:${TAG:-latest}
    build: *api-build
    environment:
      MIGRATE_ON_BOOT: '0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  matchmaker:
    <<: *app
    image: tumble/matchmaker:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/matchmaker.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  game-server:
    <<: *app
    image: tumble/game-server:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/game-server.Dockerfile
    environment:
      RESULTS_OUTBOX_DIR: /data/results-outbox
    volumes:
      - results-outbox:/data/results-outbox
    # SIGTERM drains: up to DRAIN_SETTLE_MS (15 s) + DRAIN_TIMEOUT_MS (15 min) +
    # OUTBOX_FLUSH_MS (15 s), and the server forces its own exit 30 s after
    # that. Docker kills the container after this period, so it must be longer;
    # raise both together.
    stop_grace_period: 17m
    depends_on:
      matchmaker:
        condition: service_healthy
      api:
        condition: service_healthy

  client:
    image: tumble/client:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/client.Dockerfile
    restart: unless-stopped
    volumes:
      # Optional runtime overrides: copy client-config/config.json.example to config.json.
      - ./client-config:/srv/runtime:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN:?deploy/.env is missing; run pnpm setup:env --production --domain <domain>}}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-${ACME_EMAIL:+email ${ACME_EMAIL}}}
      # Where the Caddyfile proxies each path; the defaults are the services above.
      API_UPSTREAM: ${API_UPSTREAM:-api:7360}
      MATCHMAKER_UPSTREAM: ${MATCHMAKER_UPSTREAM:-matchmaker:7370}
      GAME_SERVER_UPSTREAM: ${GAME_SERVER_UPSTREAM:-game-server:7350}
      CLIENT_UPSTREAM: ${CLIENT_UPSTREAM:-client:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; losing them means re-issuing (rate limited).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      matchmaker:
        condition: service_healthy
      game-server:
        condition: service_healthy
      client:
        condition: service_healthy

  # Nightly (by default) pg_dump into the backups volume, pruned after
  # BACKUP_KEEP_DAYS. Restore steps: docs/SELF_HOSTING.md, "Backups".
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/usr/local/bin/tumble-backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tumble}
      PGDATABASE: ${POSTGRES_DB:-tumble}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/usr/local/bin/tumble-backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Optional TURN relay for voice chat (docs/SELF_HOSTING.md, "Voice chat"):
  #   docker compose -f deploy/docker-compose.yml --profile voice up -d
  # It shares VOICE_TURN_SECRET with the API, which mints short-lived
  # credentials per player and room (the TURN REST scheme). Host networking
  # because Docker's port publishing is slow for a UDP relay range; open
  # 3478/udp, 3478/tcp and 49160-49200/udp in the firewall.
  coturn:
    image: coturn/coturn:4.6
    profiles: ['voice']
    restart: unless-stopped
    network_mode: host
    environment:
      # NOTE: read at run time, not interpolated with `:?`: Compose interpolates
      # every service, so a required variable here would break deployments
      # that never enable the profile.
      VOICE_TURN_SECRET: ${VOICE_TURN_SECRET:-}
      TURN_REALM: ${DOMAIN:-tumble}
    entrypoint: ['/bin/sh', '-c']
    # SECURITY: the denied ranges keep the relay from becoming a way into this
    # server's private networks (Postgres, Redis, internal ports) or a cloud
    # metadata service. The quotas cap one account's share of the relay (voice
    # is a few dozen kbit/s per stream).
    command:
      - |
        if [ "$${#VOICE_TURN_SECRET}" -lt 16 ]; then
          echo 'coturn: set VOICE_TURN_SECRET (16+ characters) in deploy/.env' >&2
          exit 1
        fi
        exec turnserver -n --log-file=stdout \
          --listening-port=3478 --min-port=49160 --max-port=49200 \
          --use-auth-secret --static-auth-secret="$$VOICE_TURN_SECRET" --realm="$$TURN_REALM" \
          --fingerprint --no-cli --no-multicast-peers --no-loopback-peers \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=::1 \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --user-quota=12 --total-quota=1200 --max-bps=128000
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

volumes:
  postgres:
  redis:
  results-outbox:
  caddy-data:
  caddy-config:
  backups:
