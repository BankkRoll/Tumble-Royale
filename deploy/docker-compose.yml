# Single-server Tumble Royale: Postgres, Redis, the API (after a one-shot
# migration), matchmaker, one game server, the web client and a Caddy edge
# with automatic HTTPS. docs/SELF_HOSTING.md walks through it.
#
#   pnpm setup:env --production --domain play.example.com   # writes deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Only Caddy publishes ports (80, 443). Every other service, including the
# internal and metrics endpoints, is reachable only on the compose networks.
# The optional `voice` profile adds a coturn TURN relay on the host network.
#
# SECURITY: least privilege between services.
# - Postgres and Redis sit on the internal `backend` network, which only the
#   API, its migration, the matchmaker and the backup job join. The game
#   server, the client and Caddy cannot reach them.
# - Only the API reads all of deploy/.env. The matchmaker and the game server
#   get the variables they use, listed below; the game server never sees the
#   database, Redis, JWT_SECRET or (once GAME_SERVER_HMAC_SECRET is set) the
#   deployment-wide INTERNAL_HMAC_SECRET.
# - With REDIS_PASSWORD set, Redis requires it and the API and matchmaker
#   connect with it.

name: tumble

x-ops: &ops
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: '5'

x-app: &app
  <<: *ops
  env_file: .env

# Redis inside this stack, with the password when one is set. Replaces any
# REDIS_URL in deploy/.env, which would not carry it.
x-redis-url: &redis-url redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379

x-api-build: &api-build
  context: ..
  dockerfile: deploy/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tumble}
      POSTGRES_DB: ${POSTGRES_DB:-tumble}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env is missing; run pnpm setup:env --production --domain <domain>}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      # NOTE: read at run time by the shell below rather than interpolated
      # into the command, so the password never shows in `docker inspect` args.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Append-only file: parties, presence and leaderboards survive a restart.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -- redis-server --appendonly yes --appendfsync everysec
        if [ -n "$$REDIS_PASSWORD" ]; then set -- "$$@" --requirepass "$$REDIS_PASSWORD"; fi
        exec "$$@"
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies pending SQL migrations, then exits; the API starts only after it succeeds.
  migrate:
    <<: *app
    image: tumble/api:${TAG:-latest}
    build: *api-build
    networks: [backend]
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    image: tumble/api:${TAG:-latest}
    build: *api-build
    networks: [backend, default]
    environment:
      MIGRATE_ON_BOOT: '0'
      REDIS_URL: *redis-url
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  matchmaker:
    <<: *ops
    image: tumble/matchmaker:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/matchmaker.Dockerfile
    networks: [backend, default]
    # Everything the matchmaker reads (apps/matchmaker/src/config.ts), nothing more.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:-}
      GAME_TICKET_SECRET: ${GAME_TICKET_SECRET:-}
      GAME_SERVER_SECRET: ${GAME_SERVER_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      REDIS_URL: *redis-url
      API_URL: ${API_URL:-http://api:7360}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # MM_* / GS_* pick a value for one service where deploy/.env used to set one for all.
      INTERNAL_PORT: ${MM_INTERNAL_PORT:-${INTERNAL_PORT:-}}
      INTERNAL_HOST: ${INTERNAL_HOST:-}
      ALLOW_MEMORY_STORE: ${ALLOW_MEMORY_STORE:-}
      DEFAULT_GAME_SERVER_URL: ${DEFAULT_GAME_SERVER_URL:-}
      TARGET_SIZE: ${TARGET_SIZE:-}
      MAX_WAIT_MS: ${MAX_WAIT_MS:-}
      HOT_MAX_WAIT_MS: ${HOT_MAX_WAIT_MS:-}
      HOT_THRESHOLD: ${HOT_THRESHOLD:-}
      REGION_FALLBACK_MS: ${REGION_FALLBACK_MS:-}
      TICK_MS: ${TICK_MS:-}
      RATE_LIMIT_MAX: ${MM_RATE_LIMIT_MAX:-${RATE_LIMIT_MAX:-}}
      USER_RATE_LIMIT_MAX: ${USER_RATE_LIMIT_MAX:-}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  game-server:
    <<: *ops
    image: tumble/game-server:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/game-server.Dockerfile
    # Not on `backend`: a game server has no business with Postgres or Redis.
    networks: [default]
    # Everything the game server reads (apps/game-server/src/config.ts), nothing more.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      GAME_TICKET_SECRET: ${GAME_TICKET_SECRET:-}
      GAME_SERVER_SECRET: ${GAME_SERVER_SECRET:-}
      # Its own key when deploy/.env has one; the shared key otherwise (older .env files).
      GAME_SERVER_HMAC_SECRET: ${GAME_SERVER_HMAC_SECRET:-${INTERNAL_HMAC_SECRET:-}}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      API_URL: ${API_URL:-http://api:7360}
      MATCHMAKER_URL: ${MATCHMAKER_URL:-http://matchmaker:7370}
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      SERVER_ID: ${SERVER_ID:-gs-1}
      REGION: ${REGION:-na}
      CONTROL_URL: ${CONTROL_URL:-http://game-server:7350}
      RESULTS_OUTBOX_DIR: /data/results-outbox
      INTERNAL_PORT: ${GS_INTERNAL_PORT:-${INTERNAL_PORT:-}}
      INTERNAL_HOST: ${INTERNAL_HOST:-}
      HELLO_TIMEOUT_MS: ${HELLO_TIMEOUT_MS:-}
      MAX_PENDING_PER_IP: ${MAX_PENDING_PER_IP:-}
      PLAYLIST: ${PLAYLIST:-}
      ALLOW_UNTICKETED: ${ALLOW_UNTICKETED:-}
      REPORT_RESULTS: ${REPORT_RESULTS:-}
      MAX_ROOMS: ${MAX_ROOMS:-}
      ROOM_CAPACITY: ${ROOM_CAPACITY:-}
      SERVER_CAPACITY: ${SERVER_CAPACITY:-}
      FILL_WAIT_MS: ${FILL_WAIT_MS:-}
      START_AT_HUMANS: ${START_AT_HUMANS:-}
      TICKET_FILL_WAIT_MS: ${TICKET_FILL_WAIT_MS:-}
      DRAIN_TIMEOUT_MS: ${DRAIN_TIMEOUT_MS:-}
      DRAIN_SETTLE_MS: ${DRAIN_SETTLE_MS:-}
      OUTBOX_FLUSH_MS: ${OUTBOX_FLUSH_MS:-}
    volumes:
      - results-outbox:/data/results-outbox
    # SIGTERM drains: up to DRAIN_TIMEOUT_MS (15 min, which includes the
    # DRAIN_SETTLE_MS wait for late arrivals) +
    # OUTBOX_FLUSH_MS (15 s), and the server forces its own exit 30 s after
    # that. Docker kills the container after this period, so it must be longer;
    # raise both together.
    stop_grace_period: 17m
    depends_on:
      matchmaker:
        condition: service_healthy
      api:
        condition: service_healthy

  client:
    image: tumble/client:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/client.Dockerfile
    restart: unless-stopped
    volumes:
      # Optional runtime overrides: copy client-config/config.json.example to config.json.
      - ./client-config:/srv/runtime:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN:?deploy/.env is missing; run pnpm setup:env --production --domain <domain>}}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-${ACME_EMAIL:+email ${ACME_EMAIL}}}
      # Where the Caddyfile proxies each path; the defaults are the services above.
      API_UPSTREAM: ${API_UPSTREAM:-api:7360}
      MATCHMAKER_UPSTREAM: ${MATCHMAKER_UPSTREAM:-matchmaker:7370}
      GAME_SERVER_UPSTREAM: ${GAME_SERVER_UPSTREAM:-game-server:7350}
      CLIENT_UPSTREAM: ${CLIENT_UPSTREAM:-client:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; losing them means re-issuing (rate limited).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      matchmaker:
        condition: service_healthy
      game-server:
        condition: service_healthy
      client:
        condition: service_healthy

  # Nightly (by default) pg_dump into the backups volume, pruned after
  # BACKUP_KEEP_DAYS. Restore steps: docs/SELF_HOSTING.md, "Backups".
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    entrypoint: ['/bin/sh', '/usr/local/bin/tumble-backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-tumble}
      PGDATABASE: ${POSTGRES_DB:-tumble}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/usr/local/bin/tumble-backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Optional TURN relay for voice chat (docs/SELF_HOSTING.md, "Voice chat"):
  #   docker compose -f deploy/docker-compose.yml --profile voice up -d
  # It shares VOICE_TURN_SECRET with the API, which mints short-lived
  # credentials per player and room (the TURN REST scheme). Host networking
  # because Docker's port publishing is slow for a UDP relay range; open
  # 3478/udp, 3478/tcp and 49160-49200/udp in the firewall.
  coturn:
    image: coturn/coturn:4.6
    profiles: ['voice']
    restart: unless-stopped
    network_mode: host
    environment:
      # NOTE: read at run time, not interpolated with `:?`: Compose interpolates
      # every service, so a required variable here would break deployments
      # that never enable the profile.
      VOICE_TURN_SECRET: ${VOICE_TURN_SECRET:-}
      TURN_REALM: ${DOMAIN:-tumble}
    entrypoint: ['/bin/sh', '-c']
    # SECURITY: the denied ranges keep the relay from becoming a way into this
    # server's private networks (Postgres, Redis, internal ports) or a cloud
    # metadata service. The quotas cap one account's share of the relay (voice
    # is a few dozen kbit/s per stream).
    command:
      - |
        if [ "$${#VOICE_TURN_SECRET}" -lt 16 ]; then
          echo 'coturn: set VOICE_TURN_SECRET (16+ characters) in deploy/.env' >&2
          exit 1
        fi
        exec turnserver -n --log-file=stdout \
          --listening-port=3478 --min-port=49160 --max-port=49200 \
          --use-auth-secret --static-auth-secret="$$VOICE_TURN_SECRET" --realm="$$TURN_REALM" \
          --fingerprint --no-cli --no-multicast-peers --no-loopback-peers \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=::1 \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --user-quota=12 --total-quota=1200 --max-bps=128000
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

networks:
  # Services that publish nothing still need the default network to reach each other and Caddy.
  default:
  # No route out of the host: only the services listed on it can reach the datastores.
  backend:
    internal: true

volumes:
  postgres:
  redis:
  results-outbox:
  caddy-data:
  caddy-config:
  backups:
